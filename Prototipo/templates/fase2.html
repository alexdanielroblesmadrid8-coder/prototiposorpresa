<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fase 2 - La Conexión</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <h2>🌟 Fase 2 – Construyendo Recuerdos</h2>
    <p>
        Los mejores momentos no siempre necesitan ser perfectos...<br>
        Solo necesitan ser juntos.
    </p>
    
    <p style="font-size: 1.2em; margin: 25px 0;">
        ❓ <strong>¿Qué nos gusta hacer en nuestras noches tranquilas?</strong>
    </p>
    
    <p style="font-size: 0.9em; opacity: 0.7;">
        💡 Pista: Pantalla, palomitas y abrazos...
    </p>

    <form method="post">
        <input name="respuesta" placeholder="Piensa con el corazón..." required autocomplete="off">
        <button type="submit">Continuar</button>
    </form>

    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}

    <a href="/" style="margin-top: 20px; font-size: 0.9em;">← Volver al inicio</a>
</div>
</body>
</html>
